<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="300" height="150" viewBox="0 0 600 300" role="img" aria-label="Loading placeholder">
  
  <!-- Background -->
  <rect width="600" height="300" fill="black"/>

  <!-- Avatar circle -->
  <circle cx="70" cy="70" r="50" fill="white" fill-opacity="0.35">
    <animate attributeName="fill-opacity"
             values="0.20;0.85;0.20"
             dur="1.6s"
             repeatCount="indefinite" />
  </circle>

  <!-- Title line -->
  <rect x="140" y="40" rx="6" ry="6" width="420" height="22" fill="white" fill-opacity="0.35">
    <animate attributeName="fill-opacity"
             values="0.18;0.9;0.18"
             dur="1.6s"
             begin="0.15s"
             repeatCount="indefinite" />
  </rect>

  <!-- Subtitle -->
  <rect x="140" y="72" rx="5" ry="5" width="300" height="14" fill="white" fill-opacity="0.30">
    <animate attributeName="fill-opacity"
             values="0.15;0.85;0.15"
             dur="1.6s"
             begin="0.30s"
             repeatCount="indefinite" />
  </rect>

  <!-- Content blocks -->
  <rect x="20" y="140" rx="8" ry="8" width="560" height="18" fill="white" fill-opacity="0.28">
    <animate attributeName="fill-opacity"
             values="0.12;0.8;0.12"
             dur="1.6s"
             begin="0.05s"
             repeatCount="indefinite" />
  </rect>

  <rect x="20" y="170" rx="8" ry="8" width="520" height="18" fill="white" fill-opacity="0.28">
    <animate attributeName="fill-opacity"
             values="0.12;0.8;0.12"
             dur="1.6s"
             begin="0.20s"
             repeatCount="indefinite" />
  </rect>

  <rect x="20" y="200" rx="8" ry="8" width="480" height="18" fill="white" fill-opacity="0.28">
    <animate attributeName="fill-opacity"
             values="0.12;0.8;0.12"
             dur="1.6s"
             begin="0.35s"
             repeatCount="indefinite" />
  </rect>

  <!-- Small square item -->
  <rect x="520" y="230" rx="6" ry="6" width="60" height="50" fill="white" fill-opacity="0.30">
    <animate attributeName="fill-opacity"
             values="0.18;0.85;0.18"
             dur="1.6s"
             begin="0.10s"
             repeatCount="indefinite" />
  </rect>
</svg>
